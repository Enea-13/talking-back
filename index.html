<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Talking Back</title>
    <meta name="description" content="Recognize the thought, answer it with Scripture. Inspired by Evagrius of Pontus’s Talking Back." />
    <meta name="theme-color" content="#f5efe2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1124" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Talking Back" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // A chosen light or dark theme, applied before the first paint (see applyTheme in src/lib/storage.ts).
      try {
        var t = JSON.parse(localStorage.getItem('tb:theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
