# The recorder for "Speak it back" (generate.py). `npm run audio` runs it with uv.
[project]
name = "talking-back-audio"
version = "0.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "kokoro==0.9.4",
  "misaki[en]==0.9.4",
  "soundfile>=0.13",
  "en-core-web-sm",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
